name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq lua5.4 shellcheck shfmt qt6-declarative-dev-tools

      - name: Run unit and integration tests
        run: tests/run

      - name: Check shell syntax and style
        run: |
          bash -n bin/* lib/*.sh tests/*.sh tests-e2e/run tests-e2e/verify-baseline tests-e2e/scenarios/*
          shellcheck bin/* lib/*.sh tests/*.sh tests-e2e/run tests-e2e/verify-baseline tests-e2e/scenarios/*
          shfmt -d -i 2 -ci bin/* lib/*.sh tests/*.sh tests-e2e/run tests-e2e/verify-baseline tests-e2e/scenarios/*

      - name: Check QML syntax
        run: |
          /usr/lib/qt6/bin/qmlformat HandyWidget.qml >/dev/null

      - name: Check manifest structure
        run: |
          jq --exit-status \
            '(.schemaVersion == 1)
             and (.id == "blizl.handy")
             and (.kinds | index("bar-widget") != null)
             and (.entryPoints.barWidget == "HandyWidget.qml")
             and (.barWidget.allowMultiple == false)' \
            manifest.json >/dev/null
          test -f "$(jq -r '.entryPoints.barWidget' manifest.json)"
          test -x bin/setup
          test -x bin/handy-trigger
          test -x bin/uninstall
